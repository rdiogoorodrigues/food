name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_DIOGO_PASSWORD_HASH: ${{ secrets.VITE_DIOGO_PASSWORD_HASH }}
          VITE_PARTNER_USERNAME: ${{ vars.VITE_PARTNER_USERNAME }}
          VITE_PARTNER_NAME: ${{ vars.VITE_PARTNER_NAME }}
          VITE_PARTNER_PASSWORD_HASH: ${{ secrets.VITE_PARTNER_PASSWORD_HASH }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_DIOGO_EMAIL: ${{ vars.VITE_DIOGO_EMAIL }}
          VITE_PARTNER_EMAIL: ${{ vars.VITE_PARTNER_EMAIL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
